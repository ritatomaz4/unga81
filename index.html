<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>UNGA81 · Agenda da comitiva</title>
<style>
:root{
  --navy:#1F3A5F; --navy-2:#2C4E7A; --ink:#1A1D21; --ink-2:#5B6470; --ink-3:#8A929D;
  --paper:#FFFFFF; --paper-2:#F4F5F7; --line:#E2E5EA; --line-2:#CBD1D9;
  --ok-bg:#E4F2EA; --ok:#1D6B45; --warn-bg:#FBF0DA; --warn:#8A5A0B; --bad-bg:#FBE6E6; --bad:#A03030;
  --tint:#E8EEF6; --tint-ink:#1F3A5F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper-2);color:var(--ink);font:15px/1.45 -apple-system,"SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--navy)}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + var(--sat)) 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--ink-3);font-weight:400}
.who{display:flex;align-items:center;gap:6px;background:var(--tint);color:var(--tint-ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.who svg{width:14px;height:14px}
.days{display:flex;gap:4px;padding:8px 0 10px}
.days button{flex:1;padding:7px 0 6px;border-radius:8px;font-size:12px;color:var(--ink-2);line-height:1.2}
.days button b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.days button.on{background:var(--navy);color:#fff}
.days button.on b{color:#fff}
.days button.today b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:4px;vertical-align:middle}
.views{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.views button.on{border-color:var(--navy);color:var(--navy);font-weight:600;background:var(--tint)}
main{flex:1;padding:12px 16px calc(84px + var(--sab))}
.empty{color:var(--ink-3);text-align:center;padding:48px 16px;font-size:14px}
.section-h{font-size:12px;color:var(--ink-3);margin:14px 0 6px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ev{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.ev:first-child{border-top:0}
.ev .t{width:44px;flex:none;font-size:12px;color:var(--ink-2);line-height:1.5;font-variant-numeric:tabular-nums}
.ev .t b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.ev .b{flex:1;min-width:0}
.ev .n{font-weight:600;line-height:1.3;margin:0 0 3px}
.ev .m{font-size:12.5px;color:var(--ink-2);margin:0}
.ev .m + .m{margin-top:2px}
.ev.dim .n{font-weight:400;color:var(--ink-2)}
.ev.dim .m{color:var(--ink-3)}
.ev .chev{flex:none;align-self:center;color:var(--line-2)}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--tint);color:var(--tint-ink);line-height:1.4}
.chip.me{background:var(--navy);color:#fff}
.st{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;font-weight:600}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.warn{background:var(--warn-bg);color:var(--warn)} .st.bad{background:var(--bad-bg);color:var(--bad)} .st.neu{background:var(--paper-2);color:var(--ink-2)}
.gap{margin:0 14px 0 70px;padding:6px 10px;border-radius:8px;font-size:12px;background:var(--paper-2);color:var(--ink-2);border-left:3px solid var(--line-2)}
.gap.warn{background:var(--warn-bg);color:var(--warn);border-left-color:var(--warn)}
.gap.bad{background:var(--bad-bg);color:var(--bad);border-left-color:var(--bad)}
.gap + .ev{border-top:0;margin-top:6px}
.gap{margin-top:6px}
/* visão geral */
.person{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.person:first-child{border-top:0}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--navy)}
.av.free{background:var(--line-2);color:var(--ink-2)}
.person .b{flex:1;min-width:0}
.person .n{font-weight:600;margin:0 0 2px}
.person .m{font-size:12.5px;color:var(--ink-2);margin:0}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.neu{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,26,34,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(20px + var(--sab));max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.sheet h2{font-size:18px;line-height:1.3;margin:0 0 4px;letter-spacing:-.01em}
.sheet .org{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.row svg{width:18px;height:18px;flex:none;color:var(--ink-3);margin-top:2px}
.row p{margin:0}
.row .s{font-size:12.5px;color:var(--ink-2)}
.lbl{font-size:12px;color:var(--ink-3);font-weight:600;margin:16px 0 6px}
.contact{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.contact .av{width:32px;height:32px;font-size:11px;background:var(--paper-2);color:var(--ink-2)}
.contact p{margin:0}
.contact .s{font-size:12.5px;color:var(--ink-2)}
.next{background:var(--paper-2);border-radius:10px;padding:10px 12px}
.next p{margin:0}
.next .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
textarea{width:100%;min-height:76px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--paper)}
textarea:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;background:var(--navy);color:#fff;width:100%;margin-top:10px}
.btn.sec{background:var(--paper);color:var(--navy);border:1px solid var(--line-2)}
.btn:disabled{opacity:.5}
.err{font-size:12.5px;color:var(--bad);margin:6px 0 0}
.okmsg{font-size:12.5px;color:var(--ok);margin:6px 0 0}
.links{display:flex;gap:10px;margin-top:10px}
.links a{flex:1;text-align:center;padding:9px;border:1px solid var(--line-2);border-radius:10px;font-size:13px;text-decoration:none;font-weight:600}
/* notas */
.note{padding:12px 14px;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.note .x{margin:0;font-size:14px}
.note .e{font-size:12.5px;color:var(--ink-2);margin:3px 0 0}
table.fu{width:100%;border-collapse:collapse;font-size:13px}
table.fu td,table.fu th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
table.fu th{font-size:12px;color:var(--ink-3);font-weight:600;border-top:0}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + var(--sab));max-width:640px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);padding:4px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--navy)}
nav.tabs button b{font-weight:500}
/* gate */
.gate{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:32px 28px;max-width:640px;margin:0 auto}
.gate h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.gate p{color:var(--ink-2);margin:0 0 24px}
.gate .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;margin-bottom:8px;font-size:15px}
.gate .opt .av{width:34px;height:34px;font-size:11px}
.gate input{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:8px;letter-spacing:.2em}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.sim{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.sim input{border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;font-size:13px}
.sim button{font-size:12.5px;color:var(--navy);font-weight:600}
@media (prefers-reduced-motion:reduce){.sheet,.veil,.toast{transition:none}}
</style>
</head>

const S = {
  data: null, me: localStorage.getItem("unga.me") || "", day: "", tab: "agenda", view: "mine",

/* ---------- utilidades ---------- */
function nowNY(){
  if (S.simNow) return S.simNow;
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { date:`${g("year")}-${g("month")}-${g("day")}`, min: (+g("hour")%24)*60 + +g("minute") };
}
const toMin = h => { if(!h) return null; const [a,b]=String(h).split(":"); return +a*60+ +b; };
const fmtMin = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const dayLabel = d => { const dt = new Date(d+"T12:00:00"); return { dow: DOW[dt.getDay()], n: dt.getDate() }; };
const longDay = d => { const l = dayLabel(d); return `${l.dow} ${l.n} Set`; };
const people = () => S.data.pessoas;
const person = c => people().find(p=>p.Codigo===c);
const venue = id => S.data.venues.find(v=>v.Venue_ID===id);
const who = e => String(e.Quem_vai||"").split(",").map(s=>s.trim()).filter(Boolean);
const isMine = e => S.me===SECRET ? true : who(e).includes(S.me);
const onDay = (e,d) => e.Data_inicio && d>=e.Data_inicio && d<=(e.Data_fim||e.Data_inicio);
const timed = e => e.Inicio!=="" && e.Inicio!=null;
const endOf = e => toMin(e.Fim) ?? (toMin(e.Inicio)+90);   // sem fim declarado: assume 90 min
const statusClass = s => /regist|confirm/i.test(s)?"ok":/rsvp|follow|review/i.test(s)?"neu":/declin/i.test(s)?"bad":"neu";
const statusPT = s => ({"To review":"por rever","RSVP sent":"RSVP enviado","Registered":"registado","Confirmed":"confirmado","Declined":"recusado","Following":"a acompanhar","in review":"em análise"}[s]||s||"por rever");

function dist(a,b){ // metros, linha recta × factor de quadrícula
  const va=venue(a), vb=venue(b);
  if(!va||!vb||!va.Latitude||!vb.Latitude) return null;
  if(a===b) return 0;
  const R=6371000, r=Math.PI/180, dl=(vb.Latitude-va.Latitude)*r, dg=(vb.Longitude-va.Longitude)*r;
  const h=Math.sin(dl/2)**2+Math.cos(va.Latitude*r)*Math.cos(vb.Latitude*r)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*CONFIG.DETOUR;
}
const walkMin = m => m==null?null:Math.max(1,Math.round(m/CONFIG.WALK_M_PER_MIN));
const kmTxt = m => m<950 ? `${Math.round(m/50)*50} m` : `${(m/1000).toFixed(1).replace(".",",")} km`;
function mapsUrl(e){ const v=venue(e.Venue_ID); if(v&&v.Maps_URL) return v.Maps_URL; const q=encodeURIComponent((v?v.Nome+" "+v.Morada:e.Local_original||"")+" New York"); return `https://www.google.com/maps/search/?api=1&query=${q}`; }
function placeName(e){ const v=venue(e.Venue_ID); return v ? v.Nome : (e.Local_original || "Local a confirmar"); }

function transit(prev, next){ // prev termina, next começa
  if(!prev||!next||!timed(prev)||!timed(next)) return null;
  const gap = toMin(next.Inicio) - endOf(prev);
  const d = dist(prev.Venue_ID, next.Venue_ID);
  const w = walkMin(d);
  let cls="neu", txt;
  if(d==null){ txt = gap<0 ? `sobreposição de ${-gap} min` : `${gap} min de intervalo · distância desconhecida`; if(gap<0) cls="bad"; }
  else if(d===0){ txt = gap<0 ? `sobreposição de ${-gap} min · mesmo local` : `mesmo local · ${gap} min de intervalo`; if(gap<0) cls="warn"; }
  else {
    const slack = gap - w;
    txt = `${kmTxt(d)} · ${w} min a pé`;
    if(gap<0){ cls="bad"; txt += ` · sobreposição de ${-gap} min`; }
    else if(slack<0){ cls="bad"; txt += ` · sem folga — sair às ${fmtMin(endOf(prev)+slack)} ou táxi`; }
    else if(slack<10){ cls="warn"; txt += ` · folga de ${slack} min`; }
    else txt += ` · folga de ${slack} min`;
  }
  return {cls, txt, gap, w, d};
}

function eventsFor(code, d){
  return S.data.eventos.filter(e=>onDay(e,d) && (code===SECRET||who(e).includes(code)))
    .sort((a,b)=>(timed(a)?toMin(a.Inicio):-1)-(timed(b)?toMin(b.Inicio):-1));
}

async function load(force){
  const cached = localStorage.getItem("unga.data");
  if(cached && !force){ try{ S.data = JSON.parse(cached); }catch{} }
  if(!CONFIG.API_URL){ if(!S.data||force) S.data = EMBEDDED; return; }
  try{
    const r = await fetch(`${CONFIG.API_URL}?action=agenda&code=${encodeURIComponent(CONFIG.ACCESS_CODE)}`);
    const j = await r.json(); if(j.error) throw new Error(j.error);
    S.data = j; localStorage.setItem("unga.data", JSON.stringify(j)); toast("Agenda actualizada");
  }catch(err){ if(!S.data) S.data = EMBEDDED; toast("Sem rede — a usar a última agenda guardada"); }
}
async function sendNote(n){
  if(!CONFIG.API_URL){ await new Promise(r=>setTimeout(r,400)); return true; }
  try{
    const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({action:"nota", code:CONFIG.ACCESS_CODE, ...n})});

function loadXLSX(){ return window.XLSX ? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=res; s.onerror=()=>rej(new Error("Não foi possível carregar o leitor de Excel (sem rede?)")); document.head.appendChild(s); }); }
async function importFile(file){
  IMP.err=""; IMP.preview=null;
  try{
    await loadXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array", codepage:1252, cellDates:false});
    let sheet = wb.Sheets["Eventos"] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:""});
    const hi = rows.findIndex(r=>r.some(c=>/^Time \(ET\)/i.test(String(c))) || (r.includes("ID")&&r.includes("Data_inicio")));
    if(hi<0) throw new Error("Não reconheci as colunas. Esperava 'Date / Time (ET) / Organization / Event…' ou 'ID / Data_inicio / …'.");
    const hdr = rows[hi].map(s=>String(s).trim());
    const body = rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));
    const raw = hdr.includes("Time (ET)");
    const evs = raw ? parseRaw(hdr, body) : parseNorm(hdr, body);
    IMP.preview = buildPreview(evs);
  }catch(e){ IMP.err = e.message||String(e); }
  renderMain();
}
const col = (hdr,names) => { for(const n of names){ const i=hdr.findIndex(h=>h.toLowerCase().startsWith(n.toLowerCase())); if(i>=0) return i; } return -1; };
function parseRaw(hdr, body){
  const c = { date:col(hdr,["Date"]), time:col(hdr,["Time"]), org:col(hdr,["Organization"]), ev:col(hdr,["Event"]), top:col(hdr,["Topics"]), place:col(hdr,["Place"]), rsvp:col(hdr,["RSVP"]), dead:col(hdr,["Registration"]), det:col(hdr,["Other details"]), link:col(hdr,["Link"]), st:col(hdr,["Status"]), att:col(hdr,["Attendance"]) };
  const g=(r,k)=> c[k]>=0 ? String(r[c[k]]??"").trim() : "";
  const out=[];
  for(const r of body){
    if(!g(r,"time")) continue;
    const [d0,d1]=parseDateRaw(g(r,"date")); const [ht,st,en]=parseTimeRaw(g(r,"time"));
    let det=g(r,"det"); const fm=det.match(/Format:\s*([\w-]+)/); const fmt=fm?fm[1]:""; det=det.replace(/Format:\s*[\w-]+;?/,"").trim();
    out.push({ Data_inicio:d0, Data_fim:d1, Inicio:st, Fim:en, Hora_texto:ht, Organizacao:g(r,"org"), Evento:g(r,"ev"), Venue_ID:venueGuess(g(r,"place")), Local_original:g(r,"place"), Quem_vai:codesFrom(g(r,"att")), Objetivo:"", Estado:g(r,"st")||"To review", RSVP:g(r,"rsvp"), Prazo_registo:g(r,"dead"), Detalhes:det, Link:g(r,"link"), Temas:g(r,"top").replace(/\s*\n\s*/g," "), Formato:fmt, Notas_secretariado:g(r,"att") });
  }
  return out;
}
function parseNorm(hdr, body){
  return body.map(r=>{ const o={}; hdr.forEach((h,i)=>{ if(h) o[h]=String(r[i]??"").trim(); }); return o; }).filter(o=>o.Evento||o.Organizacao);
}
function parseDateRaw(d){ const m=String(d).match(/(\d{1,2})\s*[–-]?\s*(\d{0,2})\s*Sep/i); if(!m) return ["",""]; const a=+m[1], b=m[2]?+m[2]:a; return [`2026-09-${String(a).padStart(2,"0")}`,`2026-09-${String(b).padStart(2,"0")}`]; }
function parseTimeRaw(t){
  t=String(t).replace(/\n/g," ").trim();
  if(/^all day/i.test(t)) return ["Todo o dia","",""];
  const ms=[...t.matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/gi)].filter(m=>+m[1]<=12);
  if(!ms.length) return [t,"",""];
  const hm=(m,ap)=>{ let h=+m[1], mi=+(m[2]||0); if(ap==="pm"&&h!==12) h+=12; if(ap==="am"&&h===12) h=0; return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`; };
  const a=ms[0], b=ms[1]; let apb=b&&b[3]?b[3].toLowerCase():""; let apa=a[3]?a[3].toLowerCase():apb;
  if(!apa) return [t,"",""]; if(b&&!apb) apb=apa;
  let st=hm(a,apa), en=b?hm(b,apb):"";
  if(b&&en<st&&apa===apb&&!a[3]) st=hm(a,apb==="pm"?"am":apa);
  return ["",st,en];
}
const VENUE_KEYS=[["UNHQ","unhq"],["YALE","yale"],["HARV","harvard"],["CORN","cornell club"],["PENN","penn club"],["UCLUB","university club"],["MARQ","marquis"],["JAPAN","japan society"],["SCAND","scandinavia"],["ROCK","rockefeller foundation"],["WCM","weill"],["CURE","cure"],["CURE","345, park"],["CURE","345 park"],["GATHER","studio gather"],["DEVEX","devex"],["BRYANT","bryant"],["LANGHAM","langham"],["MCNY","museum of the city"],["NYAM","academy of medicine"],["SKIRB","skirball"],["STEEL","steelcase"],["EUDEL","eu delegation"],["DKCON","denmark"],["CATH","cath"],["RENTS","renaissance"],["MEETG","meeting galleries"],["RIVER","river club"],["BEALE","beale"],["WHEEL","wheeltapper"],["ONLINE","online"],["NYC","new york city"]];
function venueGuess(p){ const s=String(p).toLowerCase(); for(const [id,k] of VENUE_KEYS) if(s.includes(k)) return id; for(const v of S.data.venues){ if(v.Nome && s.includes(String(v.Nome).toLowerCase().slice(0,12))) return v.Venue_ID; } return ""; }
function codesFrom(a){ const s=String(a).toLowerCase(); const out=[]; for(const p of people()){ const keys=[p.Codigo.toLowerCase(), ...String(p.Nome).toLowerCase().split(/\s+/).filter(w=>w.length>3)]; if(keys.some(k=>s.includes(k))) out.push(p.Codigo); } return out.join(", "); }
const evKey = e => `${e.Data_inicio}|${String(e.Evento||"").toLowerCase().replace(/\s+/g," ").trim()}`;
function buildPreview(evs){
  const cur = new Map(S.data.eventos.map(e=>[evKey(e),e]));
  let maxId = Math.max(0,...S.data.eventos.map(e=>+String(e.ID).replace(/\D/g,"")||0));
  const merged=[], lista=[]; let novos=0, alterados=0, iguais=0;
  const seen=new Set();
  for(const n of evs){
    const k=evKey(n); const old=cur.get(k);
    if(old){
      seen.add(k); const m={...old};
      let changed=false;
      for(const f of Object.keys(n)){ const v=String(n[f]??"").trim(); if(!v) continue; if(String(old[f]??"")!==v){ m[f]=v; changed=true; } }
      if(changed){ alterados++; lista.push(`Alterado: ${n.Evento}`); } else iguais++;
      merged.push(m);
    } else { maxId++; merged.push({ID:`EV${String(maxId).padStart(3,"0")}`, ...n}); novos++; lista.push(`Novo: ${n.Evento||n.Organizacao} (${n.Data_inicio||"data?"})`); }
  }
  const removidos = S.data.eventos.filter(e=>!seen.has(evKey(e))).length;
  S.data.eventos.filter(e=>!seen.has(evKey(e))).forEach(e=>lista.push(`Removido: ${e.Evento}`));
  return { total:evs.length, novos, alterados, iguais, removidos, semHora:merged.filter(e=>!e.Inicio).length, semLocal:merged.filter(e=>!venue(e.Venue_ID)).length, lista, merged };
}
async function applyImport(){
  const btn=$("#impApply"); btn.disabled=true; btn.textContent="A aplicar…";
  const eventos = IMP.preview.merged;
  if(CONFIG.API_URL){
    try{
      const r = await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"importar",code:CONFIG.ACCESS_CODE,eventos})});
      const j = await r.json(); if(j.error) throw new Error(j.error);
      await load(true); toast(`Folha actualizada: ${eventos.length} eventos`);
    }catch(e){ IMP.err="Falhou o envio para a folha: "+(e.message||e); btn.disabled=false; btn.textContent="Tentar de novo"; renderMain(); return; }
  } else {
    S.data = {...S.data, eventos}; localStorage.setItem("unga.data", JSON.stringify(S.data)); toast(`Agenda actualizada neste dispositivo: ${eventos.length} eventos`);
  }
  IMP.preview=null; IMP.err=""; S.tab="agenda"; render();
}

/* ---------- pop-up do evento ---------- */
function openEvent(id){
  const e = S.data.eventos.find(x=>x.ID===id); if(!e) return;
  const w = who(e), v = venue(e.Venue_ID);
  const cs = (S.data.contactos||[]).filter(c=>c.ID_evento===id);
  const code = S.me===SECRET ? (w[0]||null) : S.me;
  const seq = code ? eventsFor(code, e.Data_inicio).filter(timed) : [];
  const idx = seq.findIndex(x=>x.ID===id);
  const next = idx>=0 ? seq[idx+1] : null;
  const tr = next ? transit(e,next) : null;
  const when = timed(e) ? `${e.Inicio}${e.Fim?"–"+e.Fim:""}` : (e.Hora_texto||"hora a confirmar");
  const dateTxt = e.Data_inicio ? (e.Data_fim&&e.Data_fim!==e.Data_inicio ? `${longDay(e.Data_inicio)} – ${longDay(e.Data_fim)}` : longDay(e.Data_inicio)) : "data a confirmar";
  let h = `<div class="grip"></div>
  <div class="sh-top"><span>${ICON.cal.replace("<svg",'<svg width="14" height="14" style="vertical-align:-2px"')} ${esc(dateTxt)} · ${esc(when)}</span><span class="st ${statusClass(e.Estado)}">${esc(statusPT(e.Estado))}</span></div>
  <h2>${esc(e.Evento||"(sem título)")}</h2>
  <p class="org">${esc(e.Organizacao)}${e.Formato?` · ${esc(e.Formato)}`:""}</p>
  <div class="row">${ICON.pin}<div><p>${esc(placeName(e))}</p><p class="s">${esc(v?v.Morada:(e.Local_original&&e.Local_original!==placeName(e)?e.Local_original:""))}${!v?'<span class="st bad" style="margin-left:6px">local por confirmar</span>':""}</p></div></div>`;
  if(e.Detalhes||e.RSVP) h += `<div class="row">${ICON.info}<div>${e.Detalhes?`<p class="s">${esc(e.Detalhes)}</p>`:""}${e.RSVP?`<p class="s">RSVP: ${esc(e.RSVP)}</p>`:""}</div></div>`;
  h += `<p class="lbl">Quem vai</p>${w.length?`<span class="chips">${w.map(c=>`<span class="chip ${c===S.me?"me":""}">${esc(c)}</span>`).join("")}</span>`:`<span class="st bad">ninguém atribuído</span>`}`;
  if(e.Objetivo) h += `<p class="lbl">Objectivo</p><p style="margin:0">${esc(e.Objetivo)}</p>`;
  h += `<p class="lbl">Com quem falar</p>`;
  h += cs.length ? cs.map(c=>`<div class="contact"><div class="av">${esc(initials(c.Nome))}</div><div><p><b>${esc(c.Nome)}</b></p><p class="s">${esc([c.Cargo,c.Organizacao].filter(Boolean).join(", "))}${c.Objetivo_da_conversa?` · ${esc(c.Objetivo_da_conversa)}`:""}</p></div></div>`).join("") : `<p class="s" style="color:var(--ink-3);margin:0;font-size:13px">Ainda sem contactos definidos para este evento.</p>`;
  if(next){
    h += `<p class="lbl">A seguir${code&&S.me===SECRET?` (${esc(code)})`:""} · ${esc(next.Inicio)}</p><div class="next"><p><b style="font-weight:600">${esc(next.Evento)}</b></p><p class="s">${esc(placeName(next))}${tr?` · ${esc(tr.txt)}`:""}</p></div>`;
  } else if(timed(e) && code){
    h += `<p class="lbl">A seguir</p><div class="next"><p class="s">Último evento do dia.</p></div>`;
  }
  h += `<p class="lbl">Nota para o secretariado</p><textarea id="noteIn" placeholder="Ex.: enviar nota conceptual à Dra. X até sexta"></textarea><p class="err" id="noteErr" style="display:none"></p><p class="okmsg" id="noteOk" style="display:none"></p>
  <button class="btn" id="noteSend">Enviar para follow-up</button>
  <div class="links"><a href="${esc(mapsUrl(e))}" target="_blank" rel="noopener">Abrir no Maps</a>${/^https?:/.test(e.Link)?`<a href="${esc(e.Link)}" target="_blank" rel="noopener">Página do evento</a>`:""}</div>`;
  $("#sheet").innerHTML = h;
  $("#sheet").dataset.id = id;
  $("#sheet").scrollTop = 0;
  $("#veil").classList.add("on"); $("#sheet").classList.add("on");
}
function closeSheet(){ $("#veil").classList.remove("on"); $("#sheet").classList.remove("on"); }

async function submitNote(){
  const id = $("#sheet").dataset.id, e = S.data.eventos.find(x=>x.ID===id);
  const txt = $("#noteIn").value.trim(), err=$("#noteErr"), ok=$("#noteOk"), btn=$("#noteSend");
  if(!txt){ err.textContent="Escreva a nota antes de enviar."; err.style.display=""; return; }
  err.style.display="none"; btn.disabled=true; btn.textContent="A enviar…";
  const n = { Timestamp: new Date().toISOString().slice(0,16), Autor: S.me===SECRET?"SEC":S.me, ID_evento:id, Evento:e.Evento, Nota:txt };
  const sent = await sendNote(n);
  if(sent){ S.sent.push({...n, enviada:true}); ok.textContent="Enviada. O secretariado vê-a na folha Follow-up."; ok.style.display=""; $("#noteIn").value=""; }
  else { S.queue.push(n); ok.textContent="Sem rede: guardada em fila, será enviada assim que houver ligação."; ok.style.display=""; $("#noteIn").value=""; }
  persist(); btn.disabled=false; btn.textContent="Enviar para follow-up";
}

/* ---------- lembretes ---------- */
let reminderTimers=[];
function scheduleReminders(){
  reminderTimers.forEach(clearTimeout); reminderTimers=[];
  if(!("Notification" in window) || Notification.permission!=="granted" || S.me===SECRET) return;
  const now = nowNY(); if(S.simNow) return;
  eventsFor(S.me, now.date).filter(timed).forEach(e=>{
    const ms = (toMin(e.Inicio)-15-now.min)*60000;
    if(ms>0 && ms<12*3600000) reminderTimers.push(setTimeout(()=>{
      const seq=eventsFor(S.me,now.date).filter(timed), i=seq.findIndex(x=>x.ID===e.ID), prev=seq[i-1], tr=prev?transit(prev,e):null;
      new Notification(`Em 15 min: ${e.Evento}`, { body: `${placeName(e)}${tr&&tr.w?` · ${tr.w} min a pé`:""}` });
    }, ms));
  });
}

/* ---------- gate ---------- */
function renderGate(){
  const g=$("#gate");
  if(S.me && (!CONFIG.ACCESS_CODE || localStorage.getItem("unga.code")===CONFIG.ACCESS_CODE)){ g.style.display="none"; return; }
  g.style.display="";
  g.innerHTML = `<h1>UNGA81</h1><p>Agenda da comitiva · 21–25 de Setembro, Nova Iorque</p>
  ${CONFIG.ACCESS_CODE?`<input id="codeIn" placeholder="Código de acesso" autocomplete="off" inputmode="text"><p class="err" id="codeErr" style="display:none;margin-bottom:8px">Código incorrecto.</p>`:""}
  <p style="font-size:13px;margin-bottom:8px">Quem é?</p>
  ${people().map(p=>`<button class="opt" data-me="${esc(p.Codigo)}"><span class="av">${esc(p.Codigo)}</span><span>${esc(p.Nome)}</span></button>`).join("")}
  <button class="opt" data-me="${SECRET}"><span class="av" style="background:var(--ink-2)">SEC</span><span>Secretariado</span></button>`;
}

/* ---------- eventos de UI ---------- */
document.addEventListener("click", async ev=>{
  const t = ev.target.closest("button,a");
  if(!t) { if(ev.target===$("#veil")) closeSheet(); return; }
  if(t.dataset.me!=null){
    if(CONFIG.ACCESS_CODE){ const c=($("#codeIn").value||"").trim(); if(c!==CONFIG.ACCESS_CODE){ $("#codeErr").style.display=""; return; } localStorage.setItem("unga.code",c); }
    S.me=t.dataset.me; localStorage.setItem("unga.me",S.me); S.view="mine"; renderGate(); render(); scheduleReminders();
    if("Notification" in window && Notification.permission==="default" && S.me!==SECRET) Notification.requestPermission().then(scheduleReminders);
    return;
  }
  if(t.id==="whoBtn"){ S.me=""; renderGate(); return; }
  if(t.dataset.d){ S.day=t.dataset.d; render(); return; }
  if(t.dataset.v){ S.view=t.dataset.v; render(); return; }
  if(t.dataset.t){ S.tab=t.dataset.t; if(S.tab==="notas"&&S.me===SECRET&&CONFIG.API_URL) await load(true); render(); return; }
  if(t.dataset.id){ openEvent(t.dataset.id); return; }
  if(t.dataset.p){ S.tab="agenda"; const keep=S.me; S.view="all"; render(); return; }
  if(t.id==="noteSend"){ submitNote(); return; }
  if(t.id==="impApply"){ applyImport(); return; }
  if(t.id==="retry"){ await flushQueue(); render(); return; }
  if(t.id==="simGo"){ const v=$("#simIn").value; if(v){ S.simNow={date:v.slice(0,10), min:toMin(v.slice(11,16))}; S.day=S.simNow.date; render(); } return; }
  if(t.id==="simOff"){ S.simNow=null; render(); return; }
});
document.addEventListener("change", e=>{ if(e.target.id==="xlsIn" && e.target.files[0]) importFile(e.target.files[0]); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
document.addEventListener("input", e=>{ if(e.target.id==="noteIn"){ $("#noteErr").style.display="none"; $("#noteOk").style.display="none"; } });
let py=0; $("#sheet").addEventListener("touchstart",e=>{py=e.touches[0].clientY;},{passive:true});
$("#sheet").addEventListener("touchend",e=>{ if($("#sheet").scrollTop<=0 && e.changedTouches[0].clientY-py>80) closeSheet(); });
window.addEventListener("online", flushQueue);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }

/* ---------- arranque ---------- */
(async function(){
  await load(false);
  const n = nowNY(); S.day = CONFIG.WEEK.includes(n.date) ? n.date : CONFIG.WEEK[1];
  renderGate(); render(); flushQueue(); scheduleReminders();
  setInterval(()=>{ if(S.tab==="geral") renderMain(); }, 60000);
})();
</script>
</body>
